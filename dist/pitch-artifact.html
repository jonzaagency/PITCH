          onChange: (p) => { clearTimeout(tmr); tmr = setTimeout(() => sendDrawing(key), 2500); }
        });
        st.pads[key].kind = kind;
      }
      return st.pads[key];
    }
    function sendDrawing(key) {
      const p = st.pads[key];
      if (!p || !p.dirty) return;
      p.dirty = false;
      send({ type: 'drawing', data: p.export() });
    }
    function mountPads() {
      root.querySelectorAll('[data-pad]').forEach((host) => {
        const p = st.pads[host.getAttribute('data-pad')];
        if (p && p.el.parentNode !== host) { host.innerHTML = ''; host.appendChild(p.el); }
      });
    }

    // ---------- small pieces ----------
    const roleBadge = (r) => r ? '<span class="role-badge rb-' + r + '">' + esc(U.roleName(r)) + '</span>' : '';
    function header() {
      const p = st.priv, v = st.pub;
      const t = v && v.timer ? (v.timer.screw || v.timer.main) : null;
      return '<header class="ph-top">' + (p ? U.avatar(p) + '<span class="ph-name">' + esc(p.name) + '</span>' + roleBadge(p.role) : '<span class="ph-name">PITCH!</span>') +
        '<span class="grow"></span>' + (t ? U.timerHTML(t, st.recvAt, 'ph-timer') : '') +
        (p ? '<span class="cash" title="Available cash">' + U.money(p.wallet.cash) + '</span>' : '') + '</header>';
    }
    function banners() {
      let b = '';
      if (st.conn !== 'online') b += '<div class="banner warn">Reconnecting…</div>';
      else if (!st.host) b += '<div class="banner warn">Waiting for the Host’s screen to come back…</div>';
      if (st.pub && st.pub.hostPaused) b += '<div class="banner">Paused by the Host</div>';
      return b;
    }
    function card(kind, label, text, act, idx, on) {
      return '<button class="deck deck-' + kind + (on ? ' on' : '') + '" data-act="' + act + '" data-deck="' + kind + '" data-idx="' + idx + '"><span class="deck-k">' + label + '</span><span class="deck-t">' + esc(text) + '</span>' + (on ? '<span class="pick">Picked</span>' : '') + '</button>';
    }
    function profileCard(pr, withSecret) {
      return '<div class="profile"><div class="eyebrow">Your character</div><h3>' + esc(pr.name) + '</h3><ul class="facts"><li><b>Age</b> ' + esc(pr.age) + '</li><li><b>Status</b> ' + esc(pr.marital) +
        '</li><li><b>Kids</b> ' + esc(pr.kids) + '</li><li><b>Job</b> ' + esc(pr.job) + '</li></ul><p class="bg">' + esc(pr.background) + '</p>' +
        (withSecret ? '<div class="top-secret"><span class="lbl">Top secret: only you can see this</span>' + esc(pr.secret) + '</div>' +
          (pr.secretHints && pr.secretHints.length ? '<div class="secret-tip"><b>How to play it</b><ul class="hint-list">' + pr.secretHints.map((h) => '<li>' + esc(h) + '</li>').join('') + '</ul></div>' : '') +
          '<p class="hint">Stay in character and leave clues, but don’t just say it. Tap “They found my secret!” only when the Peddler figures it out.</p>' : '') + '</div>';
    }
    function confirmBtn(key, label, act, data, cls) {
      const attrs = Object.keys(data || {}).map((k) => ' data-' + k + '="' + esc(data[k]) + '"').join('');
      if (st.confirm === key) return '<div class="confirm"><button class="btn ' + (cls || 'gold') + '" data-act="' + act + '"' + attrs + '>Yes, ' + esc(label.toLowerCase()) + '</button><button class="btn ghost" data-act="cancel">Cancel</button></div>';
      return '<button class="btn ' + (cls || 'gold') + '" data-act="ask" data-ck="' + esc(key) + '">' + esc(label) + '</button>';
    }
    function nepoCards() {
      const inv = st.priv.wallet.inventory;
      return Object.values(C.nepo).filter((c) => inv[c.id] > 0);
    }

    // ---------- shop + profile (between rounds) ----------
    function shop() {
      const w = st.priv.wallet;
      return '<section class="shop"><div class="sec-head"><h3>NEPO BABY! shop</h3><span class="muted">Available cash <b>' + U.money2(w.cash) + '</b></span></div>' +
        Object.values(C.nepo).map((c) => '<div class="nepo" data-key="nepo-' + c.id + '"><div><b>' + esc(c.name) + '</b><span class="price">' + U.money(c.price) + '</span><p>' + esc(c.effect) + '</p><p class="muted">Use: ' + esc(c.when) + ' · You own ' + w.inventory[c.id] + '</p></div>' +
          (w.cash >= c.price ? confirmBtn('buy-' + c.id, 'Buy', 'buy', { card: c.id }, 'violet') : '<button class="btn ghost" disabled>Need ' + U.money(c.price - w.cash) + ' more</button>') + '</div>').join('') +
        '<p class="hint">Power Cards are used when you are the Peddler, one per pitch. They never force a score or a sale.</p></section>';
    }
    function prefs() {
      const p = st.priv;
      return '<section><div class="sec-head"><h3>Roles I’m up for</h3></div><div class="prefs">' + E.ROLES.map((r) => '<label class="set-row toggle' + (p.excluded[r] ? ' dim' : '') + '"><span>' + U.roleName(r) +
        (p.excluded[r] ? ' <em class="muted">(Host turned off)</em>' : '') + '</span><input type="checkbox" id="pref-' + r + '" data-act="pref" data-role="' + r + '"' + (p.prefs[r] ? ' checked' : '') + '></label>').join('') + '</div></section>';
    }
    function wallet() {
      const w = st.priv.wallet, prof = opts.profile;
      return '<section class="wallet"><div class="sec-head"><h3>My wallet</h3></div><div class="w-grid"><div><span>Tonight</span><b>' + U.money2(st.priv.earned) + '</b></div><div><span>Available cash</span><b>' + U.money2(w.cash) +
        '</b></div><div><span>Career earnings</span><b>' + U.money2(w.career) + '</b></div></div>' +
        (prof && prof.inventions.length ? '<details><summary>My invention collection (' + prof.inventions.length + ')</summary><div class="coll">' + prof.inventions.map((x) => '<div class="coll-i">' + (x.image ? '<img alt="" src="' + x.image + '">' : '') + '<b>' + esc(x.name) + '</b><span class="muted">' + esc([x.item, x.func].filter(Boolean).join(' + ')) + ' · ' + U.money2(x.earned) + '</span></div>').join('') + '</div></details>' : '') + '</section>';
    }

    // ---------- screens ----------
    /** Role briefing: what this player does this round. The Host can turn it off for veterans. */
    function briefScreen() {
      const v = st.pub, p = st.priv, r = v.round, t = v.settings.timers;
      const mm = (sec) => U.fmtTime(sec * 1000);
      const done = r.briefed && r.briefed[p.pid];
      const items = {
        peddler: ['<b>Creation Lab (' + mm(t.lab) + '):</b> pick one Item and one Function card, name your invention, and sketch how it works.',
          '<b>Fact-Finding (' + mm(t.fact) + '):</b> ask every Prospect real questions and say your guesses out loud. Each secret you uncover earns <b>$25</b>. No typing needed.',
          '<b>PITCH! (' + mm(t.pitch) + '):</b> sell it using what you learned. Each Prospect can SCREW! you once; you get ' + t.screw + ' seconds to respond, then the table votes on how you did.',
          '<b>Objections + Close (' + mm(t.close) + '):</b> answer every objection, then clearly ask for the sale.',
          'Philanthropists score you in six categories, $0–$50 each.'],
        prospect: ['<b>Draw</b> a portrait of your character during the Creation Lab.',
          '<b>Answer in character</b> when the Peddler questions you. Your phone gives you ways to hint at your secret. When they guess it out loud, tap <b>They found my secret!</b>',
          '<b>During the pitch,</b> play one of your three SCREW! cards to throw the Peddler off. When another Prospect plays one, vote on your phone: did the Peddler nail it?',
          '<b>After the pitch,</b> raise one objection and decide whether your character would buy.',
          'Philanthropists can award you up to <b>$25</b> for great role-play.'],
        phil: ['<b>Watch closely:</b> the Peddler invents, questions the Prospects, and pitches.',
          '<b>Vote on every SCREW!</b> when it pops up on your phone: did the Peddler nail it or miss it?',
          '<b>Then score</b> six categories, $0–$50 each: Invention, Ingenuity, Fact-Finding, Overcoming Objections, Overall Pitch, The Close.',
          '<b>Reward the Prospects</b> up to $25 each for role-play.'].concat(
          v.settings.sleuth ? ['<b>Secret Sleuth:</b> during Fact-Finding, guess each Prospect’s secret on your phone for <b>$10</b> each. Listen for hints, and lock in before the Peddler finds it!'] : [],
          v.settings.trimOutliers && r.phils.length >= E.OUTLIER_MIN_CARDS ? ['Score fairly: a scorecard way out of line with the room gets set aside.'] : [])
      }[p.role];
      if (!items) return '<section class="hello"><h2>Sitting out this round</h2><p>Enjoy the show. You’ll be in the next one.</p></section>';
      const title = { peddler: 'the Peddler', prospect: 'a Prospect', phil: 'a Philanthropist' }[p.role];
      return '<section class="brief-card rb-bg-' + p.role + '"><span class="eyebrow">This round you are</span><h2>' + title + '</h2>' +
        '<ul class="brief-list">' + items.map((x) => '<li>' + x + '</li>').join('') + '</ul>' +
        (done ? '<p class="ok center">Ready ✓ Waiting for the others…</p>' : '<button class="btn gold big" data-act="briefed">Got it</button>') + '</section>' +
        (p.role === 'prospect' && p.profile ? profileCard(p.profile, true) : '');
    }

    function lobbyScreen() {
      return '<section class="hello"><h2>You’re in!</h2><p>Watch the big screen. The Host starts the game when everyone has joined.</p></section>' + prefs() + shop() + wallet();
    }
    function rolesScreen() {
      const v = st.pub, p = st.priv;
      let top = '';
      if (v.need && v.need.role !== 'players' && !p.excluded[v.need.role] && p.volunteer !== v.need.role) {
        top = '<section class="vol"><h3>Volunteer needed</h3><p>Nobody available opted in as <b>' + esc(U.roleName(v.need.role)) + '</b>. Want to play it this round?</p><button class="btn gold" data-act="volunteer" data-role="' + v.need.role + '">Volunteer as ' + esc(U.roleName(v.need.role)) + '</button></section>';
      }
      const nr = p.nextRole;
      return top + (nr ? '<section class="next-role rb-bg-' + nr + '"><span class="eyebrow">Next round you are</span><h2>' + (nr === 'sitout' ? 'Sitting out' : 'the ' + esc(U.roleName(nr))) + '</h2><p class="muted">The Host can still change this.</p></section>' : '') + shop() + prefs() + wallet();
    }

    function peddlerLab() {
      const p = st.priv, inv = p.invention, h = p.hand;
      const k = 'r' + st.pub.round.n;
      const name = draft(k + '-name', inv.name || ''), slogan = draft(k + '-slogan', inv.slogan || '');
      pad(k + '-sketch', 'sketch');
      let nepo = '';
      if (p.wallet.inventory.knowPeople > 0 && !st.pub.round.nepoUsed) {
        const r = st.pub.round;
        const pool = st.pub.players.filter((x) => x.connected && x.id !== p.pid && r.prospects.indexOf(x.id) < 0 && x.prefs.prospect && !x.excluded.prospect);
        nepo = '<section class="nepo-use"><h3>I KNOW PEOPLE</h3><p class="muted">Before fact-finding, swap one Prospect for another player.</p>' +
          (st.chooser === 'know' ? '<label class="field"><span>Replace</span><select id="kp-out" data-draft="kp-out">' + r.prospects.map((id) => '<option value="' + esc(id) + '"' + (draft('kp-out', r.prospects[0]) === id ? ' selected' : '') + '>' + esc(r.profiles[id] ? r.profiles[id].name : '') + ' (' + esc(st.pub.players.find((x) => x.id === id).name) + ')</option>').join('') + '</select></label>' +
            '<label class="field"><span>With</span><select id="kp-in" data-draft="kp-in">' + pool.map((x) => '<option value="' + esc(x.id) + '"' + (draft('kp-in', pool[0] && pool[0].id) === x.id ? ' selected' : '') + '>' + esc(x.name) + '</option>').join('') + '</select></label>' +
            (pool.length ? '<button class="btn violet" data-act="knowGo">Make the call</button>' : '<p class="muted">Nobody else has opted in as a Prospect.</p>') + ' <button class="btn ghost" data-act="chooser" data-c="">Cancel</button>'
            : '<button class="btn violet" data-act="chooser" data-c="know">Use I KNOW PEOPLE</button>') + '</section>';
      }
      return '<section class="lab-steps"><h2>Creation Lab</h2><p class="muted">Pick one Item and one Function, name it, and sketch how it works.</p>' +
        '<h4>1. Item</h4><div class="hand">' + h.items.map((t, i) => card('item', 'Item', t, 'pick', i, inv.item === i)).join('') + '</div>' +
        '<h4>2. Function</h4><div class="hand">' + h.functions.map((t, i) => card('func', 'Function', t, 'pick', i, inv.func === i)).join('') + '</div>' +
        '<h4>3. Name it</h4><label class="field"><span>Product name</span><input id="inv-name" maxlength="40" data-draft="' + k + '-name" data-sync="name" value="' + esc(name) + '" placeholder="The Toast-o-Tron 3000" autocomplete="off"></label>' +
        '<label class="field"><span>Slogan (optional)</span><input id="inv-slogan" maxlength="90" data-draft="' + k + '-slogan" data-sync="slogan" value="' + esc(slogan) + '" placeholder="Breakfast, but smarter." autocomplete="off"></label>' +
        '<h4>4. Sketch it</h4><p class="muted">Show how it works. Talent is not judged; using the drawing in your pitch is.</p><div class="pad-host" data-keep="' + k + '-sketch" data-pad="' + k + '-sketch"></div>' +
        (p.labDone ? '<p class="ok center">Ready ✓ Waiting for the others…</p><button class="btn ghost" data-act="unready">Keep editing</button>' : '<button class="btn gold big" data-act="labDone">I’m ready</button>') + '</section>' + nepo;
    }

    function prospectLab() {
      const p = st.priv;
      const k = 'r' + st.pub.round.n;
      pad(k + '-portrait', 'portrait');
      return profileCard(p.profile, true) +
        '<section><h3>Draw your character</h3><p class="muted">A playful portrait. It goes on the big screen.</p><div class="pad-host" data-keep="' + k + '-portrait" data-pad="' + k + '-portrait"></div>' +
        (p.labDone ? '<p class="ok center">Ready ✓</p>' : '<button class="btn gold big" data-act="labDone">I’m ready</button>') + '</section>' +
        '<section><h3>Your SCREW! cards</h3><p class="muted">During the pitch you may play one of these. Choose wisely.</p><div class="screws">' + p.screws.map((c) => '<div class="screw-c"><b>' + esc(c.t) + '</b><p>' + esc(c.d) + '</p></div>').join('') + '</div></section>';
    }

    function philWait(text) {
      return '<section class="hello"><h2>' + text + '</h2><p>Watch the big screen. You’ll score the Peddler in six categories, $0–$50 each, and can reward each Prospect’s role-play up to $25.</p></section>' + sleuthBlock() + scorecard(false);
    }

    function peddlerFact() {
      const v = st.pub, r = v.round, p = st.priv;
      return '<section><h2>Fact-Finding</h2><p class="muted">Ask every Prospect at least one meaningful question. Uncover a secret for <b>$25</b>. Just say your guess out loud: the Prospect confirms it on their phone. Eyes up, phone down!</p>' +
        '<p class="hint"><b>Secrets hide in everyday topics.</b> Try asking about ' + esc(C.peddlerQuestionTips.join(', ')) + '.</p></section>' +
        r.prospects.map((id) => {
          const pr = r.profiles[id], s = r.secrets[id];
          return '<section class="pros-card" data-key="pf-' + esc(id) + '"><h3>' + esc(pr.name) + '</h3><ul class="facts"><li><b>Age</b> ' + esc(pr.age) + '</li><li><b>Status</b> ' + esc(pr.marital) + '</li><li><b>Kids</b> ' + esc(pr.kids) + '</li><li><b>Job</b> ' + esc(pr.job) + '</li></ul><p class="bg">' + esc(pr.background) + '</p>' +
            (s === 'confirmed' ? '<div class="secret unlocked"><span class="lbl">Secret unlocked +$25</span>' + esc(pr.secret || '') + '</div>'
              : '<p class="muted">Secret still hidden. Say your guess out loud; they’ll tap it in if you’re right.</p>') +
            '</section>';
        }).join('') + insiderUse() + daddyUse() + notes();
    }
    function notes() {
      return '<section><h3>My notes</h3><textarea id="notes" rows="4" data-draft="notes" placeholder="Things you learned. Only you can see this.">' + esc(draft('notes', '')) + '</textarea></section>';
    }
    function insiderUse() {
      const r = st.pub.round, p = st.priv;
      const peek = p.insider ? '<section class="nepo-use"><h3>INSIDE TRADING</h3><p>' + esc(playerName(p.insider.phil)) + ' thinks <b>' + esc(r.profiles[p.insider.target].name) + '</b>’s secret is:</p><p class="guess">“' + esc(p.insider.text) + '”</p><p class="muted">Only you can see this. Still confirm it with good questions!</p></section>' : '';
      if (!(p.wallet.inventory.insider > 0) || r.nepoUsed || !st.pub.settings.sleuth) return peek;
      if (st.chooser !== 'insider') return '<section class="nepo-use"><h3>INSIDE TRADING</h3><p class="muted">Peek at one Philanthropist’s Secret Sleuth guess.</p><button class="btn violet" data-act="chooser" data-c="insider">Use it</button></section>';
      return '<section class="nepo-use"><h3>INSIDE TRADING</h3>' +
        '<label class="field"><span>Whose notes?</span><select id="it-phil" data-draft="it-phil">' + r.phils.map((id) => '<option value="' + esc(id) + '"' + (draft('it-phil', r.phils[0]) === id ? ' selected' : '') + '>' + esc(playerName(id)) + '</option>').join('') + '</select></label>' +
        '<label class="field"><span>Which Prospect?</span><select id="it-target" data-draft="it-target">' + r.prospects.map((id) => '<option value="' + esc(id) + '"' + (draft('it-target', r.prospects[0]) === id ? ' selected' : '') + '>' + esc(r.profiles[id].name) + '</option>').join('') + '</select></label>' +
        '<button class="btn violet" data-act="insiderGo">Peek</button> <button class="btn ghost" data-act="chooser" data-c="">Cancel</button></section>';
    }
    function playerName(id) { const x = st.pub.players.find((pl) => pl.id === id); return x ? x.name : 'Someone'; }
    function daddyUse() {
      const r = st.pub.round, p = st.priv;
      if (!(p.wallet.inventory.daddy > 0) || r.nepoUsed) return '';
      if (st.chooser !== 'daddy') return '<section class="nepo-use"><h3>DADDY MADE A CALL</h3><p class="muted">Make a Prospect do a brief, funny challenge.</p><button class="btn violet" data-act="chooser" data-c="daddy">Use it</button></section>';
      return '<section class="nepo-use"><h3>DADDY MADE A CALL</h3><p>Who gets the call?</p><div class="btn-col">' + r.prospects.map((id) => '<button class="btn violet" data-act="daddy" data-target="' + esc(id) + '">' + esc(r.profiles[id].name) + '</button>').join('') + '<button class="btn ghost" data-act="chooser" data-c="">Cancel</button></div></section>';
    }

    function prospectFact() {
      const p = st.priv;
      const found = p.secretStatus === 'confirmed';
      return '<section class="found-sec">' + (found ? '<p class="ok center">Your secret is out. The Peddler earns $25.</p>'
        : st.confirm === 'reveal' ? '<p class="center"><b>Did they really figure it out?</b></p><div class="confirm"><button class="btn mint big" data-act="selfReveal">Yes, award them $25</button><button class="btn ghost" data-act="cancel">Not yet</button></div>'
          : '<button class="btn mint big found-btn" data-act="ask" data-ck="reveal">They found my secret!</button><p class="hint center">Tap this the moment the Peddler says it out loud.</p>') + '</section>' +
        profileCard(p.profile, true) +
        '<section class="btn-col">' + (p.asked ? '<p class="ok">You confirmed you were questioned ✓</p>' : '<button class="btn ghost" data-act="asked">The Peddler asked me a real question</button>') + '</section>';
    }

    function peddlerPitch() {
      const v = st.pub, r = v.round, p = st.priv, inv = r.invention;
      let screw = '';
      if (r.activeScrew) {
        screw = '<section class="screw-live">' + U.screwIcon() + '<div class="screw-word">SCREW!</div><h3>' + esc(r.activeScrew.card.t) + '</h3><p>' + esc(r.activeScrew.card.d) + '</p><p class="muted">You have 15 seconds. The pitch clock is paused. The table votes on how you did.</p>' +
          '<div class="btn-row"><button class="btn gold" data-act="screwDone">I’m done responding</button>' +
          (p.wallet.inventory.notToday > 0 && !r.nepoUsed ? '<button class="btn violet big" data-act="notToday">Play NOT TODAY!</button>' : '') + '</div></section>';
      }
      return screw + '<section><h2>' + esc(inv.name) + '</h2>' + (inv.slogan ? '<p class="slogan">“' + esc(inv.slogan) + '”</p>' : '') +
        '<div class="hand">' + '<div class="deck deck-item"><span class="deck-k">Item</span><span class="deck-t">' + esc(inv.item) + '</span></div><div class="deck deck-func"><span class="deck-k">Function</span><span class="deck-t">' + esc(inv.func) + '</span></div></div>' +
        '<p class="hint">Show the drawing on the big screen, and connect the benefits to what you learned about each Prospect.</p>' +
        (!r.activeScrew ? confirmBtn('pdone', 'I’m done pitching', 'pitchDone', {}, 'ghost') : '') + '</section>' + daddyUse() + notes();
    }

    function prospectPitch() {
      const v = st.pub, r = v.round, p = st.priv;
      const t = v.timer.main;
      const remaining = t ? (t.running ? t.remaining - (Date.now() - st.recvAt) : t.remaining) : 0;
      if (p.screwPlayed) {
        const sv = (r.screwVotes || {})[p.pid], t = p.screwPlayed.tally;
        return '<section class="screw-live">' + U.screwIcon() + '<div class="screw-word">SCREW!</div><h3>You played ' + esc(p.screwPlayed.card.t) + '</h3><p>' + esc(p.screwPlayed.card.d) + '</p>' +
          (p.screwPlayed.result ? '<p class="muted">The table says: ' + esc({ done: 'they nailed it', missed: 'they missed it', split: 'split decision', cancelled: 'cancelled with NOT TODAY!' }[p.screwPlayed.result]) + (t ? ' (' + t.done + '–' + t.missed + ')' : '') + '</p>'
            : sv && sv.open ? '<p class="muted">The table is voting… ' + sv.n + ' of ' + sv.of + ' in</p>' : '') + '</section>' + profileCard(p.profile, true);
      }
      let why = '';
      if (r.activeScrew) why = 'Another SCREW! is in progress.';
      else if (v.hostPaused) why = 'The game is paused.';
      else if (remaining <= E.SCREW_LOCKOUT_MS) why = 'Too late: no SCREW! in the final 10 seconds.';
      return '<section><h2>Your SCREW! cards</h2><p class="muted">Interrupt the pitch once with one of these. The other two are discarded.</p>' + (why ? '<p class="warn-text">' + esc(why) + '</p>' : '') +
        '<div class="screws">' + p.screws.map((c, i) => '<div class="screw-c" data-key="sc-' + i + '"><b>' + esc(c.t) + '</b><p>' + esc(c.d) + '</p>' +
          (why ? '' : confirmBtn('screw-' + i, 'Play this SCREW!', 'screw', { idx: i }, 'red')) + '</div>').join('') + '</div></section>' + profileCard(p.profile, true);
    }

    function prospectClose() {
      const p = st.priv, r = st.pub.round;
      const raised = !!r.objections[p.pid];
      return '<section><h2>Objections + Close</h2>' + (raised ? '<p class="ok">You raised your objection ✓</p>' : '<p class="muted">Raise one final objection. The Peddler has to address it and ask for the sale.</p><button class="btn red big" data-act="objection">I have an objection!</button>') + '</section>' + verdictBlock() + profileCard(p.profile, true);
    }
    function verdictBlock() {
      const p = st.priv;
      return '<section><h3>Would your character buy it?</h3><p class="muted">Revealed with the money. It doesn’t change the score.</p><div class="btn-row">' +
        '<button class="btn ' + (p.verdict === 'buy' ? 'mint' : 'ghost') + '" data-act="verdict" data-buy="1">Buy</button><button class="btn ' + (p.verdict === 'pass' ? 'red' : 'ghost') + '" data-act="verdict" data-buy="0">Pass</button></div></section>';
    }

    function scorecard(canSubmit) {
      const v = st.pub, r = v.round, p = st.priv;
      if (!r) return '';
      const k = 'sc-r' + r.n;
      const base = p.scorecard || { cats: {}, prospects: {} };
      const sc = st.drafts[k] || (st.drafts[k] = { cats: Object.assign(C.categories.reduce((o, c) => { o[c.id] = 25; return o; }, {}), base.cats), prospects: Object.assign({}, base.prospects) });
      const total = C.categories.reduce((s, c) => s + Number(sc.cats[c.id] || 0), 0);
      return '<section class="scorecard"><div class="sec-head"><h3>' + (canSubmit ? 'Your scorecard' : 'Scorecard (submit opens after the close)') + '</h3><span class="sc-total">' + U.money(total) + '<em>/ $300</em></span></div>' +
        C.categories.map((c) => '<label class="slider" data-key="sl-' + c.id + '"><span class="sl-top"><b>' + esc(c.name) + '</b><span class="sl-val">' + U.money(sc.cats[c.id]) + '</span></span><span class="muted sl-hint">' + esc(c.hint) + '</span>' +
          '<input type="range" min="0" max="50" step="5" id="sc-' + c.id + '" data-score="cats.' + c.id + '" value="' + Number(sc.cats[c.id]) + '"></label>').join('') +
        '<h4>Prospect role-play awards (optional)</h4>' + r.prospects.map((id) => '<label class="slider" data-key="slp-' + esc(id) + '"><span class="sl-top"><b>' + esc(r.profiles[id].name) + '</b><span class="sl-val">' + U.money(sc.prospects[id] || 0) + '</span></span><span class="muted sl-hint">Stayed in character, believable, answered fairly, added fun.</span>' +
          '<input type="range" min="0" max="25" step="5" id="scp-' + esc(id) + '" data-score="prospects.' + esc(id) + '" value="' + Number(sc.prospects[id] || 0) + '"></label>').join('') +
        (canSubmit && v.settings.trimOutliers && r.phils.length >= E.OUTLIER_MIN_CARDS ? '<p class="hint">Score fairly: a scorecard more than ' + U.money(E.OUTLIER_GAP) + ' away from the rest of the room gets set aside.</p>' : '') +
        (canSubmit ? '<button class="btn gold big" data-act="submitScore">' + (p.scorecard ? 'Update my scorecard' : 'Submit scorecard') + '</button>' + (p.scorecard ? '<p class="ok center">Submitted ✓ You can change it until the reveal.</p>' : '') : '') + '</section>';
    }

    /** Secret Sleuth: during Fact-Finding, pick each Prospect's secret from 4 options for +$10.
     *  A pick locks once that secret is uncovered, and all picks lock when Fact-Finding ends. */
    function sleuthBlock() {
      const list = st.priv.sleuth, picks = st.priv.sleuthPicks || {};
      if (!list || !list.length || st.pub.phase === 'reveal') return '';
      const open = st.pub.phase === 'fact';
      return '<section class="sleuth"><div class="sleuth-head"><span class="eyebrow">Secret Sleuth</span><b>' + U.money(E.SLEUTH_BONUS) + ' for each secret you guess right</b></div>' +
        '<p class="muted">' + (open ? 'Listen to the interviews. You can change a guess until that secret is uncovered.' : 'Guesses are locked. Results at the Money Reveal.') + '</p>' +
        list.map((t) => '<fieldset class="sleuth-q" data-key="sq-' + esc(t.pid) + '"><legend>' + esc(t.name) + (t.locked && open ? ' · locked' : '') + '</legend>' + t.options.map((o, i) =>
          '<button type="button" class="sleuth-opt' + (picks[t.pid] === i ? ' on' : '') + '" data-act="sleuthPick" data-pid="' + esc(t.pid) + '" data-idx="' + i + '" aria-pressed="' + (picks[t.pid] === i) + '"' + (t.locked ? ' disabled' : '') + '>' + esc(o) + '</button>').join('') + '</fieldset>').join('') + '</section>';
    }

    function sleuthResults() {
      const p = st.priv;
      if (!p.sleuth || !p.sleuth.length || !p.sleuthAnswers) return '';
      const mine = p.sleuthPicks || {};
      const res = p.sleuthResult || { correct: 0, of: p.sleuth.length, amount: 0 };
      return '<section class="sleuth"><div class="sleuth-head"><span class="eyebrow">Secret Sleuth</span><b>' + res.correct + ' of ' + res.of + ' right · +' + U.money2(res.amount) + '</b></div>' +
        p.sleuth.map((t) => {
          const pick = mine[t.pid], ans = p.sleuthAnswers[t.pid];
          if (ans === undefined) return '';
          return '<div class="sleuth-res" data-key="sr-' + esc(t.pid) + '"><b>' + esc(t.name) + '</b><span>' + esc(t.options[ans]) + '</span>' +
            (pick === undefined ? '<em class="muted">No pick</em>' : pick === ans ? '<em class="ok">You got it ✓</em>' : '<em class="err">You picked: ' + esc(t.options[pick]) + '</em>') + '</div>';
        }).join('') + '</section>';
    }

    function revealScreen() {
      const v = st.pub, p = st.priv, r = v.round;
      const mine = p.myEarnings;
      let hof = '';
      if (p.role === 'peddler' || p.role === 'prospect') {
        hof = '<section><h3>Hall of Fame</h3><p class="muted">Feature your ' + (p.role === 'peddler' ? 'invention and sketch' : 'character portrait') + ' in the Host’s Hall of Fame?</p><div class="btn-row">' +
          '<button class="btn ' + (p.hofChoice === true ? 'mint' : 'ghost') + '" data-act="hof" data-yes="1">Yes, feature it</button><button class="btn ' + (p.hofChoice === false ? 'red' : 'ghost') + '" data-act="hof" data-yes="0">No thanks</button></div></section>';
      }
      return '<section class="hello">' + (mine != null ? '<span class="eyebrow">You earned this round</span><div class="price-tag big-tag"><b>' + U.money2(mine) + '</b></div>' : '<h2>Money reveal</h2>') +
        '<p>Tonight so far: <b>' + U.money2(p.earned) + '</b></p></section>' + sleuthResults() + hof + shop() + wallet();
    }

    function awardsScreen() {
      const v = st.pub, p = st.priv, aw = v.awards;
      if (!aw) return '';
      const mine = p.votes || {};
      const img = (c) => (c.image && st.assets[c.image.id] ? '<img alt="" src="' + st.assets[c.image.id] + '">' : '');
      return '<section class="hello"><span class="eyebrow">End-of-night awards</span><h2>Cast your votes</h2><p class="muted">Tap one nominee in each category. You can change your mind until the winners are revealed.</p></section>' +
        aw.cats.map((c) => '<section class="vote-cat" data-key="vc-' + c.id + '"><h3>' + esc(c.title) + '</h3><div class="vote-list">' + c.candidates.map((x) => {
          const self = x.owner === p.pid;
          return '<button class="vote-opt' + (mine[c.id] === x.key ? ' on' : '') + '" data-act="vote" data-cat="' + c.id + '" data-key2="' + esc(x.key) + '"' + (self ? ' disabled' : '') + '>' + img(x) +
            '<span><b>' + esc(x.label) + '</b><em>' + (self ? 'That’s you' : esc(x.sub)) + '</em></span></button>';
        }).join('') + '</div></section>').join('');
    }
    function myTrophies() {
      const v = st.pub, p = st.priv;
      const res = v.awards && v.awards.results;
      if (!res) return '';
      const won = res.filter((r) => r.winners.some((w) => w.owner === p.pid));
      return won.length ? '<section class="trophy-mine"><span class="eyebrow">You won</span>' + won.map((r) => '<h3>' + esc(r.title) + '</h3>').join('') + '</section>' : '';
    }

    function finalScreen() {
      const v = st.pub, p = st.priv;
      const rank = v.standings.findIndex((x) => x.id === p.pid) + 1;
      const me = v.standings.find((x) => x.id === p.pid);
      return '<section class="hello"><span class="eyebrow">Final results</span><h2>' + (me && me.winner ? 'You’re the session champion!' : 'You finished #' + rank) + '</h2><div class="price-tag big-tag"><b>' + U.money2(p.earned) + '</b></div><p class="muted">Your cash and Power Cards are saved on this device for next time.</p></section>' + myTrophies() + shop() + wallet();
    }

    function body() {
      const v = st.pub, p = st.priv;
      if (!v || !p) return '<section class="hello"><h2>Connecting…</h2></section>';
      if (p.removed) return '<section class="hello"><h2>You’re not in this game</h2><p>' + esc(p.error || 'The Host removed you from the room.') + '</p><button class="btn gold" data-act="leave">Back</button></section>';
      const ph = v.phase, role = p.role;
      if (ph === 'lobby') return lobbyScreen();
      if (ph === 'roles') return rolesScreen();
      if (ph === 'reveal') return revealScreen();
      if (ph === 'final') return finalScreen();
      if (ph === 'awards') return awardsScreen();
      if (role === 'sitout' || !role) return '<section class="hello"><h2>Sitting out this round</h2><p>Enjoy the show. You’ll be in the next one.</p></section>';
      if (ph === 'brief') return briefScreen();
      if (ph === 'lab') return role === 'peddler' ? peddlerLab() : role === 'prospect' ? prospectLab() : philWait(esc((st.pub.players.find((x) => x.id === st.pub.round.peddler) || { name: 'The Peddler' }).name) + ' is inventing…');
      if (ph === 'fact') return role === 'peddler' ? peddlerFact() : role === 'prospect' ? prospectFact() : philWait('Fact-Finding');
      if (ph === 'pitch') return role === 'peddler' ? peddlerPitch() : role === 'prospect' ? prospectPitch() : philWait('PITCH!');
      if (ph === 'close') return role === 'peddler' ? '<section class="hello"><h2>Objections + Close</h2><p>Answer every objection directly, then clearly <b>ask for the sale</b>.</p></section>' + notes()
        : role === 'prospect' ? prospectClose() : philWait('Objections + Close');
      if (ph === 'scoring') return role === 'phil' ? scorecard(true) : role === 'prospect' ? '<section class="hello"><h2>The Philanthropists are scoring</h2></section>' + (p.verdict ? '' : verdictBlock())
        : '<section class="hello"><h2>The Philanthropists are deciding your fate</h2><p>Sit tight.</p></section>';
      return '';
    }

    /** SCREW! vote pop-up for Philanthropists and the other Prospects. Buttons open once the Peddler's response time ends. */
    function screwPop() {
      const v = st.pub, p = st.priv;
      if (!v || !p || !v.round || v.phase !== 'pitch') return '';
      const list = (p.screwVotes || []).filter((x) => !x.mine);
      if (!list.length) return '';
      const sv = list[0], live = v.round.activeScrew && v.round.activeScrew.by === sv.by;
      const ped = playerName(v.round.peddler);
      return '<div class="overlay screw-ov screw-pop-wrap" role="alertdialog" aria-label="SCREW! vote"><div class="screw-pop">' + U.screwIcon() +
        '<div class="screw-word">SCREW!</div><p class="by">' + esc(sv.name) + ' plays</p><h3>' + esc(sv.card.t) + '</h3><p>' + esc(sv.card.d) + '</p>' +
        (live ? '<p class="pop-q">Watch ' + esc(ped) + ' respond…</p>' + U.timerHTML(v.timer.screw, st.recvAt, 'screw-timer') : '<p class="pop-q">Did ' + esc(ped) + ' nail it?</p>') +
        '<div class="btn-row pop-btns"><button class="btn mint big" data-act="screwVote" data-by="' + esc(sv.by) + '" data-result="done"' + (live ? ' disabled' : '') + '>Nailed it</button>' +
        '<button class="btn ghost big" data-act="screwVote" data-by="' + esc(sv.by) + '" data-result="missed"' + (live ? ' disabled' : '') + '>Missed it</button></div></div></div>';
    }

    function render() {
      U.morph(root, '<div class="phone">' + header() + banners() + '<main class="ph-body" data-key="pb-' + (st.pub ? st.pub.phase + '-' + (st.priv && st.priv.role) : 'x') + '">' + body() + '</main>' + screwPop() + '</div>');
      mountPads();
    }

    // ---------- updates from the Host ----------
    function onPublic(v, at) {
      const prev = st.pub;
      st.pub = v; st.recvAt = at || Date.now();
      if (prev && prev.phase !== v.phase) {
        // leaving the lab: send any unsent drawing right away
        if (prev.phase === 'lab') Object.keys(st.pads).forEach(sendDrawing);
        st.confirm = null; st.chooser = null;
        if (st.priv && st.priv.role && v.phase !== 'scoring') U.vibrate(60);
      }
      const sc = v.round && v.round.activeScrew;
      if (sc && !(prev && prev.round && prev.round.activeScrew) && st.priv && st.priv.role === 'peddler') U.vibrate([80, 60, 80]);
      render();
    }
    function onPrivate(p) {
      const prev = st.priv;
      st.priv = p;
      const fresh = (p.screwVotes || []).some((x) => !(prev && prev.screwVotes || []).some((y) => y.by === x.by));
      if (fresh) U.vibrate([120, 60, 120]);
      if (p.lastError && p.lastError.at !== st.lastErr) {
        if (st.lastErr) U.toast(p.lastError.error, 'warn');
        st.lastErr = p.lastError.at;
      }
      if (opts.profile && p.wallet && !p.removed) {
        opts.profile.wallet = p.wallet; opts.profile.name = p.name;
        // save this round's invention to the player's own collection
        if (st.pub && st.pub.phase === 'reveal' && p.role === 'peddler' && st.pub.round && st.pub.round.invention && !st.sent['coll-' + st.pub.round.n]) {
          const inv = st.pub.round.invention, pd = st.pads['r' + st.pub.round.n + '-sketch'];
          st.sent['coll-' + st.pub.round.n] = true;
          opts.profile.inventions.unshift({ name: inv.name, slogan: inv.slogan, item: inv.item, func: inv.func, earned: p.myEarnings || 0, date: Date.now(), image: pd && !pd.isEmpty() ? pd.export() : null });
          opts.profile.inventions = opts.profile.inventions.slice(0, 30);
        }
        opts.onProfile && opts.onProfile(opts.profile);
      }
      if (prev && !prev.role && p.role) U.vibrate(80);
      render();
    }

    // ---------- events ----------
    let syncTimer = null;
    root.addEventListener('input', (e) => {
      const el = e.target;
      if (el.dataset.score) {
        const k = 'sc-r' + st.pub.round.n;
        const [grp, id] = el.dataset.score.split('.');
        st.drafts[k][grp][id] = Number(el.value);
        render();
        return;
      }
      if (el.dataset.draft) st.drafts[el.dataset.draft] = el.value;
      if (el.dataset.sync) {
        clearTimeout(syncTimer);
        syncTimer = setTimeout(() => {
          const k = 'r' + st.pub.round.n;
          send({ type: 'invention', name: draft(k + '-name', ''), slogan: draft(k + '-slogan', '') });
        }, 500);
      }
    });
    root.addEventListener('change', (e) => {
      const el = e.target;
      if (el.dataset.draft) st.drafts[el.dataset.draft] = el.value;
      if (el.dataset.act === 'pref') {
        const prefs = Object.assign({}, st.priv.prefs, { [el.dataset.role]: el.checked });
        if (opts.profile) { opts.profile.prefs = prefs; opts.onProfile && opts.onProfile(opts.profile); }
        send({ type: 'prefs', prefs });
      }
    });
    root.addEventListener('click', (e) => {
      const el = e.target.closest('[data-act]');
      if (!el || !root.contains(el) || el.tagName === 'INPUT') return;
      const d = el.dataset, a = d.act;
      const r = st.pub && st.pub.round;
      if (a === 'ask') st.confirm = d.ck;
      else if (a === 'cancel') st.confirm = null;
      else if (a === 'chooser') st.chooser = d.c || null;
      else if (a === 'pick') {
        const field = { item: 'item', func: 'func' }[d.deck];
        st.priv.invention[field] = Number(d.idx); // optimistic
        send({ type: 'invention', [field]: Number(d.idx) });
      } else if (a === 'labDone') {
        Object.keys(st.pads).forEach((k) => { if (st.pads[k].dirty) sendDrawing(k); });
        if (st.priv.role === 'peddler') {
          const k = 'r' + r.n;
          send({ type: 'invention', name: draft(k + '-name', st.priv.invention.name || ''), slogan: draft(k + '-slogan', st.priv.invention.slogan || '') });
        }
        send({ type: 'labDone' });
      } else if (a === 'unready') send({ type: 'labDone', done: false });
      else if (a === 'knowGo') { send({ type: 'nepo', card: 'knowPeople', target: draft('kp-out', r.prospects[0]), replacement: draft('kp-in', (root.querySelector('#kp-in') || {}).value) }); st.chooser = null; }
      else if (a === 'daddy') { send({ type: 'nepo', card: 'daddy', target: d.target }); st.chooser = null; }
      else if (a === 'notToday') send({ type: 'nepo', card: 'notToday' });
      else if (a === 'screwDone') send({ type: 'screwDone' });
      else if (a === 'screwVote') { (st.priv.screwVotes || []).forEach((x) => { if (x.by === d.by) x.mine = d.result; }); send({ type: 'screwVote', by: d.by, result: d.result }); U.toast('Vote in ✓'); }
      else if (a === 'answer') send({ type: 'secretAnswer', yes: d.yes === '1' });
      else if (a === 'selfReveal') { send({ type: 'secretAnswer', yes: true }); st.confirm = null; }
      else if (a === 'asked') send({ type: 'asked' });
      else if (a === 'vote') { st.priv.votes = Object.assign({}, st.priv.votes, { [d.cat]: d.key2 }); send({ type: 'vote', cat: d.cat, key: d.key2 }); }
      else if (a === 'briefed') { if (st.pub.round) { st.pub.round.briefed = Object.assign({}, st.pub.round.briefed, { [st.priv.pid]: true }); } send({ type: 'briefed' }); }
      else if (a === 'screw') { send({ type: 'screw', idx: Number(d.idx) }); st.confirm = null; U.vibrate(100); }
      else if (a === 'pitchDone') { send({ type: 'pitchDone' }); st.confirm = null; }
      else if (a === 'objection') send({ type: 'objection' });
      else if (a === 'verdict') { st.priv.verdict = d.buy === '1' ? 'buy' : 'pass'; send({ type: 'verdict', buy: d.buy === '1' }); }
      else if (a === 'submitScore') { const k = 'sc-r' + r.n; send({ type: 'scorecard', cats: st.drafts[k].cats, prospects: st.drafts[k].prospects }); U.toast('Scorecard sent'); }
      else if (a === 'sleuthPick') { st.priv.sleuthPicks = Object.assign({}, st.priv.sleuthPicks, { [d.pid]: Number(d.idx) }); send({ type: 'sleuthPick', target: d.pid, idx: Number(d.idx) }); }
      else if (a === 'insiderGo') { send({ type: 'nepo', card: 'insider', phil: draft('it-phil', r.phils[0]), target: draft('it-target', r.prospects[0]) }); st.chooser = null; }
      else if (a === 'hof') send({ type: 'hof', yes: d.yes === '1' });
      else if (a === 'volunteer') send({ type: 'volunteer', role: d.role });
      else if (a === 'buy') { send({ type: 'buy', card: d.card }); st.confirm = null; }
      else if (a === 'leave') { opts.onLeave && opts.onLeave(); return; }
      render();
    });

    return {
      public: onPublic, private: onPrivate,
      asset: (id, data) => { st.assets[id] = data; },
      host: (on) => { st.host = on; render(); },
      connection: (c) => { st.conn = c; render(); },
      render,
      state: st
    };
  }

  P.phone = { create };
})(window.PITCH = window.PITCH || {});

      '<div><h4>Each round</h4><ol><li>Creation Lab · 2:00</li><li>Fact-Finding · 2:30 · $25 per secret uncovered</li><li>PITCH! · 1:30 · each Prospect may SCREW! once (15 s, clock pauses, then the table votes)</li><li>Objections + Close · 0:45</li><li>Money Reveal</li></ol></div>' +
      '<div><h4>Money</h4><p>Each Philanthropist awards $0–$50 in six categories: Invention, Ingenuity, Fact-Finding, Overcoming Objections, Overall Pitch, The Close. ' +
      'The Peddler earns the average scorecard plus $25 per secret (with 4+ Philanthropists, a scorecard more than $100 away from the rest of the room is set aside). Prospects earn the average of up to $25 each for role-play. ' +
      '<b>Secret Sleuth:</b> during Fact-Finding, Philanthropists guess each Prospect’s secret from 4 options, $10 per correct guess. The Peddler can buy <b>INSIDE TRADING</b> to peek at a guess. Most money tonight wins.</p>' +
      '<p>Spend cash between rounds on NEPO BABY! Power Cards: NOT TODAY! ($75), I KNOW PEOPLE ($100), DADDY MADE A CALL ($125).</p></div></div>';
  }

  function hofScreen() {
    reset('home-mode');
    const list = U.store.get('pitch.hof', []);
    root.innerHTML = '<div class="home"><header class="hero small"><h1 class="logo">Hall of Fame</h1><p class="muted">Inventions and portraits players chose to feature, saved on this device.</p></header>' +
      (list.length ? '<div class="hof-grid">' + list.map((e) => '<div class="hof-card">' + (e.image ? '<img alt="' + esc(e.name) + '" src="' + e.image + '">' : '') + '<span class="eyebrow">' + (e.kind === 'invention' ? 'Invention' : 'Prospect') + '</span><b>' + esc(e.name) + '</b>' + (e.slogan ? '<em>“' + esc(e.slogan) + '”</em>' : '') + '<span class="muted">by ' + esc(e.creator) + ' · ' + U.money2(e.earned) + '</span></div>').join('') + '</div>'
        : '<p class="center muted">Nothing featured yet. After a round, the Peddler and Prospects can opt in from their phones.</p>') +
      '<div class="actions"><button class="btn gold" data-go="back">Back</button></div></div>';
    root.onclick = (e) => { if (e.target.closest('[data-go]')) home(); };
  }

  function statusScreen(title, text, retry) {
    reset('home-mode');
    root.innerHTML = '<div class="home status"><h1 class="logo">PITCH<span>!</span></h1><h2>' + esc(title) + '</h2><p>' + esc(text || '') + '</p>' +
      (retry ? '<div class="actions"><button class="btn gold" data-go="retry">Try again</button><button class="btn ghost" data-go="home">Back</button></div>' : '<div class="spinner" aria-hidden="true"></div>') + '</div>';
    root.onclick = (e) => { const b = e.target.closest('[data-go]'); if (!b) return; if (b.dataset.go === 'retry') retry(); else home(); };
  }

  // ---------------------------------------------------------------- host
  async function startHost(saved) {
    statusScreen('Opening your room…', 'Connecting to the game server.');
    let code = saved ? saved.state.code : N.randomCode();
    const opts = () => ({ clientId: 'pH' + N.randomId(12), will: { topic: N.PREFIX + code + '/status', payload: 'offline', retain: true } });
    let client;
    try {
      for (let attempt = 0; attempt < 4; attempt++) {
        client = await N.connectHost(opts());
        if (saved) break;
        const taken = await new Promise((res) => {
          let hit = false;
          client.on('message', (t, p) => { if (t === N.PREFIX + code + '/status' && p === 'online') hit = true; });
          client.subscribe([N.PREFIX + code + '/status']);
          setTimeout(() => res(hit), 900);
        });
        if (!taken) break;
        client.end(); code = N.randomCode();
      }
    } catch (e) {
      statusScreen('Couldn’t reach the game server', 'Check this device’s internet connection, then try again. (Some work or school networks block it.)', () => startHost(saved));
      return;
    }
    const view = reset('host-mode');
    const game = saved ? new E.Game({ saved }) : new E.Game({ code });
    let saveTimer = null;
    const link = new N.HostLink(game, client, {
      reconnect: () => N.connectHost(opts()),
      save: (g) => { clearTimeout(saveTimer); saveTimer = setTimeout(() => { const d = g.serialize(); d.savedAt = Date.now(); U.store.set('pitch.host', d); }, 1500); }
    });
    const tv = P.tv.create(view, {
      game, joinUrl: siteUrl(),
      onExit: () => { link.close(); U.store.del('pitch.host'); home(); }
    });
    let raf = 0;
    link.onUpdate((m) => {
      if (m.connection) U.toast(m.connection === 'online' ? 'Back online' : 'Connection lost. Reconnecting…', m.connection === 'online' ? '' : 'warn');
      if (!raf) raf = requestAnimationFrame(() => { raf = 0; tv.render(); });
    });
    link.start();
    tv.render();
    U.keepAwake();
    const unload = () => { /* keep retained state so a refresh can resume */ };
    window.addEventListener('beforeunload', unload);
    cleanup = () => { window.removeEventListener('beforeunload', unload); };
  }

  // ---------------------------------------------------------------- join
  function joinScreen(code, err) {
    reset('phone-mode');
    const prof = U.profile.load();
    root.innerHTML = '<div class="phone join"><header class="ph-top"><span class="logo">PITCH<span>!</span></span></header><main class="ph-body"><section>' +
      '<h2>Join a game</h2><form id="joinForm" novalidate>' +
      '<label class="field"><span>Room code</span><input id="j-code" class="code-input" maxlength="4" autocomplete="off" autocapitalize="characters" spellcheck="false" placeholder="ABCD" value="' + esc(code || '') + '"></label>' +
      '<label class="field"><span>Your name</span><input id="j-name" maxlength="16" autocomplete="nickname" placeholder="Name" value="' + esc(prof.name) + '"></label>' +
      '<fieldset class="prefs"><legend>Roles I’m up for</legend>' + E.ROLES.map((r) => '<label class="set-row toggle"><span>' + U.roleName(r) + '</span><input type="checkbox" id="j-' + r + '"' + (prof.prefs[r] ? ' checked' : '') + '></label>').join('') + '</fieldset>' +
      (err ? '<p class="err">' + esc(err) + '</p>' : '') +
      '<button class="btn gold big" type="submit">Join</button></form>' +
      (prof.wallet.cash > 0 ? '<p class="muted center">Your saved cash: <b>' + U.money2(prof.wallet.cash) + '</b></p>' : '') +
      '</section><button class="btn ghost" id="j-back" type="button">Back</button></main></div>';
    const f = document.getElementById('joinForm');
    const ci = document.getElementById('j-code');
    ci.addEventListener('input', () => { ci.value = ci.value.toUpperCase().replace(/[^A-Z]/g, ''); });
    if (!code) ci.focus();
    document.getElementById('j-back').onclick = () => { history.replaceState(null, '', location.pathname); home(); };
    f.addEventListener('submit', (e) => {
      e.preventDefault();
      const c = ci.value.trim().toUpperCase(), name = document.getElementById('j-name').value.trim();
      if (c.length !== 4) return joinScreen(c, 'Room codes are 4 letters.');
      if (!name) return joinScreen(c, 'Enter your name.');
      const prefs = {}; E.ROLES.forEach((r) => { prefs[r] = document.getElementById('j-' + r).checked; });
      U.unlockAudio();
      doJoin(c, name, prefs);
    });
  }

  async function doJoin(code, name, prefs) {
    const prof = U.profile.load();
    prof.name = name; prof.prefs = prefs; U.profile.save(prof);
    statusScreen('Finding room ' + code + '…');
    const identKey = 'pitch.ident.' + code;
    const ident = U.store.get(identKey, null) || { pid: prof.id, token: N.randomId(16), seq: 0 };
    let client;
    try { client = await N.findRoom(code, 'pP' + N.randomId(10)); } catch (e) {
      joinScreen(code, 'Couldn’t find room ' + code + '. Check the code on the big screen (and your internet connection).');
      return;
    }
    U.store.set(identKey, ident);
    U.store.set('pitch.lastRoom', { code, name, at: Date.now() });
    const view = reset('phone-mode');
    let link;
    const phone = P.phone.create(view, {
      send: (a) => link.send(a), profile: prof,
      onProfile: (p) => U.profile.save(p),
      onLeave: () => { link.leave(); U.store.del('pitch.lastRoom'); home(); }
    });
    link = new N.PlayerLink(client, code, ident, {
      public: phone.public, private: (v) => { if (v.removed) U.store.del('pitch.lastRoom'); phone.private(v); }, asset: phone.asset, host: phone.host, connection: phone.connection,
      saveIdent: (i) => U.store.set(identKey, i),
      reconnect: () => N.findRoom(code, 'pP' + N.randomId(10))
    });
    link.start({ type: 'join', name, prefs, wallet: prof.wallet });
    phone.render();
    U.keepAwake();
    cleanup = () => link.leave();
  }

  // ---------------------------------------------------------------- practice
  // seat 0 is the person at the screen: their saved name, else a real name so sentences read naturally
  const PRACTICE_NAMES = ['Sam', 'Ava', 'Ben', 'Cleo', 'Dev', 'Eli', 'Fay', 'Gus', 'Hal', 'Ivy', 'Jo', 'Kai'];
  const nameSeat0 = () => { PRACTICE_NAMES[0] = U.profile.load().name.trim() || 'Sam'; };
  function practiceSetup() {
    nameSeat0();
    reset('home-mode');
    let n = U.store.get('pitch.practiceN', 5);
    const draw = () => {
      root.innerHTML = '<div class="home"><header class="hero small"><div class="eyebrow">Practice mode</div><h1 class="logo">PITCH<span>!</span></h1><p class="tagline">The TV and every phone on one screen. Switch phones with the tabs. Bots play every seat except the phone you’re looking at.</p></header>' +
        '<section class="setup"><h3>How many players?</h3><div class="seg big-seg">' + [3, 4, 5, 6, 8, 10].map((k) => '<button data-n="' + k + '" class="' + (k === n ? 'on' : '') + '">' + k + '</button>').join('') + '</div>' +
        '<p class="muted">' + PRACTICE_NAMES.slice(0, n).join(', ') + '</p><div class="actions"><button class="btn ghost" data-go="back">Back</button><button class="btn gold big" data-go="start">Start practice</button></div></section></div>';
    };
    draw();
    root.onclick = (e) => {
      const b = e.target.closest('[data-n]');
      if (b) { n = Number(b.dataset.n); U.store.set('pitch.practiceN', n); draw(); return; }
      const g = e.target.closest('[data-go]');
      if (!g) return;
      if (g.dataset.go === 'back') home(); else startPractice(n);
    };
  }

  function startPractice(n) {
    nameSeat0();
    reset('practice-mode');
    root.onclick = null;
    root.innerHTML = '<div class="practice"><div class="pr-switch seg"><button data-view="tv" class="on">TV</button><button data-view="phone">Phones</button></div>' +
      '<div class="pr-tv" id="prTv"></div><aside class="pr-side"><div class="pr-tabs" id="prTabs"></div><label class="set-row toggle pr-bots"><span>Bots play the other seats</span><input type="checkbox" id="prBots" checked></label><div class="pr-phones" id="prPhones"></div></aside></div>';
    const broker = new N.MemoryBroker();
    const game = new E.Game({ code: 'PRAC' });
    const hostLink = new N.HostLink(game, broker.client());
    const tvEl = document.getElementById('prTv');
    const tv = P.tv.create(tvEl, { game, practice: true, onExit: () => home() });
    let raf = 0;
    hostLink.onUpdate(() => { if (!raf) raf = requestAnimationFrame(() => { raf = 0; tv.render(); }); });
    hostLink.start();
    const seats = [];
    const phonesEl = document.getElementById('prPhones');
    for (let i = 0; i < n; i++) {
      const el = document.createElement('div');
      el.className = 'pr-phone'; el.hidden = i !== 0;
      phonesEl.appendChild(el);
      const prof = { id: 'bot' + i, name: PRACTICE_NAMES[i], prefs: { peddler: true, prospect: true, phil: true }, wallet: { career: 0, cash: 0, inventory: { notToday: 0, knowPeople: 0, daddy: 0, insider: 0 } }, inventions: [] };
      const ident = { pid: 'seat' + i, token: 'seat' + i + N.randomId(6), seq: 0 };
      let link;
      const phone = P.phone.create(el, { send: (a) => link.send(a), profile: prof, onProfile: () => {}, onLeave: () => {}, practice: true });
      link = new N.PlayerLink(broker.client(), 'PRAC', ident, { public: phone.public, private: phone.private, asset: phone.asset });
      link.start({ type: 'join', name: PRACTICE_NAMES[i], prefs: prof.prefs, wallet: prof.wallet });
      seats.push({ el, phone, link, memo: {}, name: PRACTICE_NAMES[i] });
    }
    // in practice, nobody times out
    setTimeout(() => Object.values(game.s.players).forEach((p) => { p.bot = true; }), 300);
    let current = 0;
    const tabs = document.getElementById('prTabs');
    const drawTabs = () => {
      tabs.innerHTML = seats.map((s, i) => {
        const pv = s.phone.state.priv;
        return '<button class="pr-tab' + (i === current ? ' on' : '') + '" data-seat="' + i + '">' + (pv ? U.avatar(pv) : '') + '<span>' + esc(s.name) + '</span>' + (pv && pv.role ? '<i class="dot dot-' + pv.role + '"></i>' : '') + '</button>';
      }).join('');
    };
    tabs.onclick = (e) => {
      const b = e.target.closest('[data-seat]');
      if (!b) return;
      current = Number(b.dataset.seat);
      seats.forEach((s, i) => { s.el.hidden = i !== current; });
      seats[current].phone.render();
      drawTabs();
    };
    root.querySelector('.pr-switch').onclick = (e) => {
      const b = e.target.closest('[data-view]');
      if (!b) return;
      root.querySelector('.practice').setAttribute('data-view', b.dataset.view);
      root.querySelectorAll('.pr-switch button').forEach((x) => x.classList.toggle('on', x === b));
    };
    const botsBox = document.getElementById('prBots');
    const botTimer = setInterval(() => {
      drawTabs();
      if (!botsBox.checked) return;
      seats.forEach((s, i) => { if (i !== current) bot(s); });
    }, 1100);
    tv.render();
    cleanup = () => { clearInterval(botTimer); hostLink.close(); seats.forEach((s) => s.link.leave()); };
  }

  /** Simple practice bot: does something reasonable for its role in each phase. */
  function bot(seat) {
    const st = seat.phone.state, v = st.pub, p = st.priv, m = seat.memo;
    if (!v || !p || p.removed) return;
    const r = v.round, key = v.phase + (r ? r.n : '');
    const once = (k, fn) => { if (!m[key + k]) { m[key + k] = true; fn(); } };
    const send = (a) => seat.link.send(a);
    const rnd = (n) => Math.floor(Math.random() * n);
    const chance = (x) => Math.random() < x;
    if (v.phase === 'brief' && p.role && p.role !== 'sitout') {
      once('brief', () => setTimeout(() => send({ type: 'briefed' }), 800 + rnd(2500)));
    } else if (v.phase === 'lab' && p.role === 'peddler') {
      if (p.invention.item == null) {
        const it = rnd(3);
        send({ type: 'invention', item: it, func: rnd(3), name: 'The ' + p.hand.items[it] + ' ' + ['3000', 'Deluxe', 'Pro Max', '-inator', 'Supreme'][rnd(5)], slogan: ['You need this.', 'Why not?', 'Life, upgraded.', 'Patent pending.'][rnd(4)] });
      } else once('draw', () => { const pad = new U.DrawPad(); pad.scribble(); send({ type: 'drawing', data: pad.export() }); });
      if (p.invention.item != null && !p.labDone && chance(0.3)) send({ type: 'labDone' });
    } else if (v.phase === 'lab' && p.role === 'prospect') {
      once('draw', () => { const pad = new U.DrawPad(); pad.scribble(); send({ type: 'drawing', data: pad.export() }); });
      if (!p.labDone && chance(0.3)) send({ type: 'labDone' });
    } else if (v.phase === 'fact' && p.role === 'prospect') {
      if (!p.asked && chance(0.25)) send({ type: 'asked' });
      if (p.secretStatus !== 'confirmed' && chance(0.004)) send({ type: 'secretAnswer', yes: true });
    } else if (v.phase === 'fact' && p.role === 'phil') {
      (p.sleuth || []).forEach((t) => { if (!t.locked && (p.sleuthPicks || {})[t.pid] === undefined) once('sleuth-' + t.pid, () => setTimeout(() => send({ type: 'sleuthPick', target: t.pid, idx: rnd(t.options.length) }), 1500 + rnd(6000))); });
    } else if (v.phase === 'pitch' && (p.screwVotes || []).some((x) => !x.mine && !(r.activeScrew && r.activeScrew.by === x.by))) {
      p.screwVotes.forEach((x) => { if (!x.mine && !(r.activeScrew && r.activeScrew.by === x.by)) once('vote-screw-' + x.by, () => setTimeout(() => send({ type: 'screwVote', by: x.by, result: chance(0.6) ? 'done' : 'missed' }), 800 + rnd(3000))); });
    } else if (v.phase === 'pitch' && p.role === 'prospect') {
      const t = v.timer.main;
      const left = t ? t.remaining - (t.running ? Date.now() - st.recvAt : 0) : 0;
      if (!p.screwPlayed && !r.activeScrew && !v.hostPaused && left > 25000 && chance(0.06)) send({ type: 'screw', idx: rnd(3) });
    } else if (v.phase === 'close' && p.role === 'prospect') {
      if (!r.objections[p.pid] && chance(0.2)) send({ type: 'objection' });
      if (!p.verdict && chance(0.15)) send({ type: 'verdict', buy: chance(0.5) });
    } else if (v.phase === 'scoring' && p.role === 'phil') {
      once('score', () => {
        const cats = {}; C.categories.forEach((c) => { cats[c.id] = 15 + rnd(8) * 5; });
        const pros = {}; r.prospects.forEach((id) => { pros[id] = rnd(6) * 5; });
        setTimeout(() => send({ type: 'scorecard', cats, prospects: pros }), 1000 + rnd(3000));
      });
    } else if (v.phase === 'scoring' && p.role === 'prospect') {
      if (!p.verdict) send({ type: 'verdict', buy: chance(0.5) });
    } else if (v.phase === 'awards' && v.awards) {
      v.awards.cats.forEach((c) => {
        const opts = c.candidates.filter((x) => x.owner !== p.pid);
        if (opts.length && !(p.votes || {})[c.id]) once('vote-' + c.id, () => setTimeout(() => send({ type: 'vote', cat: c.id, key: opts[rnd(opts.length)].key }), 600 + rnd(3000)));
      });
    } else if (v.phase === 'reveal' && (p.role === 'peddler' || p.role === 'prospect')) {
      once('hof', () => send({ type: 'hof', yes: chance(0.5) }));
    }
  }

  // ---------------------------------------------------------------- boot
  app_boot();
  function app_boot() {
    U.startTimerLoop({ beep: true });
    const q = new URLSearchParams(location.search);
    const room = (q.get('room') || '').toUpperCase().replace(/[^A-Z]/g, '').slice(0, 4);
    if (room && onlineAllowed()) joinScreen(room);
    else if (q.get('practice') != null) startPractice(Number(q.get('practice')) || 5);
    else home();
  }
  P.app = { home, startPractice };
})(window.PITCH = window.PITCH || {});

/* artifact build */
</script>
