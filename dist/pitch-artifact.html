      return '<section class="nepo-use"><h3>INSIDE TRADING</h3>' +
        '<label class="field"><span>Whose notes?</span><select id="it-phil" data-draft="it-phil">' + r.phils.map((id) => '<option value="' + esc(id) + '"' + (draft('it-phil', r.phils[0]) === id ? ' selected' : '') + '>' + esc(playerName(id)) + '</option>').join('') + '</select></label>' +
        '<label class="field"><span>Which Prospect?</span><select id="it-target" data-draft="it-target">' + r.prospects.map((id) => '<option value="' + esc(id) + '"' + (draft('it-target', r.prospects[0]) === id ? ' selected' : '') + '>' + esc(r.profiles[id].name) + '</option>').join('') + '</select></label>' +
        '<button class="btn violet" data-act="insiderGo">Peek</button> <button class="btn ghost" data-act="chooser" data-c="">Cancel</button></section>';
    }
    function playerName(id) { const x = st.pub.players.find((pl) => pl.id === id); return x ? x.name : 'Someone'; }
    function daddyUse() {
      const r = st.pub.round, p = st.priv;
      if (!(p.wallet.inventory.daddy > 0) || r.nepoUsed) return '';
      if (st.chooser !== 'daddy') return '<section class="nepo-use"><h3>DADDY MADE A CALL</h3><p class="muted">Make a Prospect do a brief, funny challenge.</p><button class="btn violet" data-act="chooser" data-c="daddy">Use it</button></section>';
      return '<section class="nepo-use"><h3>DADDY MADE A CALL</h3><p>Who gets the call?</p><div class="btn-col">' + r.prospects.map((id) => '<button class="btn violet" data-act="daddy" data-target="' + esc(id) + '">' + esc(r.profiles[id].name) + '</button>').join('') + '<button class="btn ghost" data-act="chooser" data-c="">Cancel</button></div></section>';
    }

    function prospectFact() {
      const p = st.priv;
      const found = p.secretStatus === 'confirmed';
      return '<section class="found-sec">' + (found ? '<p class="ok center">Your secret is out. The Peddler earns $25.</p>'
        : st.confirm === 'reveal' ? '<p class="center"><b>Did they really figure it out?</b></p><div class="confirm"><button class="btn mint big" data-act="selfReveal">Yes, award them $25</button><button class="btn ghost" data-act="cancel">Not yet</button></div>'
          : '<button class="btn mint big found-btn" data-act="ask" data-ck="reveal">They found my secret!</button><p class="hint center">Tap this the moment the Peddler says it out loud.</p>') + '</section>' +
        profileCard(p.profile, true);
    }

    function peddlerPitch() {
      const v = st.pub, r = v.round, p = st.priv, inv = r.invention;
      let screw = '';
      if (r.activeScrew) {
        screw = '<section class="screw-live">' + U.screwIcon() + '<div class="screw-word">SCREW!</div><h3>' + esc(r.activeScrew.card.t) + '</h3><p>' + esc(r.activeScrew.card.d) + '</p><p class="muted">You have 15 seconds. The pitch clock is paused. The table votes on how you did.</p>' +
          '<div class="btn-row"><button class="btn gold" data-act="screwDone">I’m done responding</button>' +
          (p.wallet.inventory.notToday > 0 && !r.nepoUsed ? '<button class="btn violet big" data-act="notToday">Play NOT TODAY!</button>' : '') + '</div></section>';
      }
      return screw + '<section><h2>' + esc(inv.name) + '</h2>' + (inv.slogan ? '<p class="slogan">“' + esc(inv.slogan) + '”</p>' : '') +
        '<div class="hand">' + '<div class="deck deck-item"><span class="deck-k">Item</span><span class="deck-t">' + esc(inv.item) + '</span></div><div class="deck deck-func"><span class="deck-k">Function</span><span class="deck-t">' + esc(inv.func) + '</span></div></div>' +
        '<p class="hint">Show the drawing on the big screen, and connect the benefits to what you learned about each Prospect.</p>' +
        (!r.activeScrew ? confirmBtn('pdone', 'I’m done pitching', 'pitchDone', {}, 'ghost') : '') + '</section>' + daddyUse() + notes();
    }

    function prospectPitch() {
      const v = st.pub, r = v.round, p = st.priv;
      const t = v.timer.main;
      const remaining = t ? (t.running ? t.remaining - (Date.now() - st.recvAt) : t.remaining) : 0;
      if (p.screwPlayed) {
        const sv = (r.screwVotes || {})[p.pid], t = p.screwPlayed.tally;
        return '<section class="screw-live">' + U.screwIcon() + '<div class="screw-word">SCREW!</div><h3>You played ' + esc(p.screwPlayed.card.t) + '</h3><p>' + esc(p.screwPlayed.card.d) + '</p>' +
          (p.screwPlayed.result ? '<p class="muted">The table says: ' + esc({ done: 'they nailed it', missed: 'they missed it', split: 'split decision', cancelled: 'cancelled with NOT TODAY!' }[p.screwPlayed.result]) + (t ? ' (' + t.done + '–' + t.missed + ')' : '') + '</p>'
            : sv && sv.open ? '<p class="muted">The table is voting… ' + sv.n + ' of ' + sv.of + ' in</p>' : '') + '</section>' + profileCard(p.profile, true);
      }
      let why = '';
      if (r.activeScrew) why = 'Another SCREW! is in progress.';
      else if (v.hostPaused) why = 'The game is paused.';
      else if (remaining <= E.SCREW_LOCKOUT_MS) why = 'Too late: no SCREW! in the final 10 seconds.';
      return '<section><h2>Your SCREW! cards</h2><p class="muted">Interrupt the pitch once with one of these. The other two are discarded.</p>' + (why ? '<p class="warn-text">' + esc(why) + '</p>' : '') +
        '<div class="screws">' + p.screws.map((c, i) => '<div class="screw-c" data-key="sc-' + i + '"><b>' + esc(c.t) + '</b><p>' + esc(c.d) + '</p>' +
          (why ? '' : confirmBtn('screw-' + i, 'Play this SCREW!', 'screw', { idx: i }, 'red')) + '</div>').join('') + '</div></section>' + profileCard(p.profile, true);
    }

    function prospectClose() {
      const p = st.priv, r = st.pub.round;
      const raised = !!r.objections[p.pid];
      return '<section><h2>Objections + Close</h2>' + (raised ? '<p class="ok">You raised your objection ✓</p>' : '<p class="muted">Raise one final objection. The Peddler has to address it and ask for the sale.</p><button class="btn red big" data-act="objection">I have an objection!</button>') + '</section>' + verdictBlock() + profileCard(p.profile, true);
    }
    function verdictBlock() {
      const p = st.priv;
      return '<section><h3>Would your character buy it?</h3><p class="muted">Revealed with the money. It doesn’t change the score.</p><div class="btn-row">' +
        '<button class="btn ' + (p.verdict === 'buy' ? 'mint' : 'ghost') + '" data-act="verdict" data-buy="1">Buy</button><button class="btn ' + (p.verdict === 'pass' ? 'red' : 'ghost') + '" data-act="verdict" data-buy="0">Pass</button></div></section>';
    }

    function scorecard(canSubmit) {
      const v = st.pub, r = v.round, p = st.priv;
      if (!r) return '';
      const k = 'sc-r' + r.n;
      const base = p.scorecard || { cats: {}, prospects: {} };
      const sc = st.drafts[k] || (st.drafts[k] = { cats: Object.assign(C.categories.reduce((o, c) => { o[c.id] = 25; return o; }, {}), base.cats), prospects: Object.assign({}, base.prospects) });
      const total = C.categories.reduce((s, c) => s + Number(sc.cats[c.id] || 0), 0);
      return '<section class="scorecard"><div class="sec-head"><h3>' + (canSubmit ? 'Your scorecard' : 'Scorecard (submit opens after the close)') + '</h3><span class="sc-total">' + U.money(total) + '<em>/ $300</em></span></div>' +
        C.categories.map((c) => '<label class="slider" data-key="sl-' + c.id + '"><span class="sl-top"><b>' + esc(c.name) + '</b><span class="sl-val">' + U.money(sc.cats[c.id]) + '</span></span><span class="muted sl-hint">' + esc(c.hint) + '</span>' +
          '<input type="range" min="0" max="50" step="5" id="sc-' + c.id + '" data-score="cats.' + c.id + '" value="' + Number(sc.cats[c.id]) + '"></label>').join('') +
        '<h4>Prospect role-play awards (optional)</h4>' + r.prospects.map((id) => '<label class="slider" data-key="slp-' + esc(id) + '"><span class="sl-top"><b>' + esc(r.profiles[id].name) + '</b><span class="sl-val">' + U.money(sc.prospects[id] || 0) + '</span></span><span class="muted sl-hint">Stayed in character, believable, answered fairly, added fun.</span>' +
          '<input type="range" min="0" max="25" step="5" id="scp-' + esc(id) + '" data-score="prospects.' + esc(id) + '" value="' + Number(sc.prospects[id] || 0) + '"></label>').join('') +
        (canSubmit && v.settings.trimOutliers && r.phils.length >= E.OUTLIER_MIN_CARDS ? '<p class="hint">Score fairly: a scorecard more than ' + U.money(E.OUTLIER_GAP) + ' away from the rest of the room gets set aside.</p>' : '') +
        (canSubmit ? '<button class="btn gold big" data-act="submitScore">' + (p.scorecard ? 'Update my scorecard' : 'Submit scorecard') + '</button>' + (p.scorecard ? '<p class="ok center">Submitted ✓ You can change it until the reveal.</p>' : '') : '') + '</section>';
    }

    /** Secret Sleuth: during Fact-Finding, pick each Prospect's secret from 4 options for +$10.
     *  A pick locks once that secret is uncovered, and all picks lock when Fact-Finding ends. */
    function sleuthBlock() {
      const list = st.priv.sleuth, picks = st.priv.sleuthPicks || {};
      if (!list || !list.length || st.pub.phase === 'reveal') return '';
      const open = st.pub.phase === 'fact';
      return '<section class="sleuth"><div class="sleuth-head"><span class="eyebrow">Secret Sleuth</span><b>' + U.money(E.SLEUTH_BONUS) + ' for each secret you guess right</b></div>' +
        '<p class="muted">' + (open ? 'Listen to the interviews. You can change a guess until that secret is uncovered.' : 'Guesses are locked. Results at the Money Reveal.') + '</p>' +
        list.map((t) => '<fieldset class="sleuth-q" data-key="sq-' + esc(t.pid) + '"><legend>' + esc(t.name) + (t.locked && open ? ' · locked' : '') + '</legend>' + t.options.map((o, i) =>
          '<button type="button" class="sleuth-opt' + (picks[t.pid] === i ? ' on' : '') + '" data-act="sleuthPick" data-pid="' + esc(t.pid) + '" data-idx="' + i + '" aria-pressed="' + (picks[t.pid] === i) + '"' + (t.locked ? ' disabled' : '') + '>' + esc(o) + '</button>').join('') + '</fieldset>').join('') + '</section>';
    }

    function sleuthResults() {
      const p = st.priv;
      if (!p.sleuth || !p.sleuth.length || !p.sleuthAnswers) return '';
      const mine = p.sleuthPicks || {};
      const res = p.sleuthResult || { correct: 0, of: p.sleuth.length, amount: 0 };
      return '<section class="sleuth"><div class="sleuth-head"><span class="eyebrow">Secret Sleuth</span><b>' + res.correct + ' of ' + res.of + ' right · +' + U.money2(res.amount) + '</b></div>' +
        p.sleuth.map((t) => {
          const pick = mine[t.pid], ans = p.sleuthAnswers[t.pid];
          if (ans === undefined) return '';
          return '<div class="sleuth-res" data-key="sr-' + esc(t.pid) + '"><b>' + esc(t.name) + '</b><span>' + esc(t.options[ans]) + '</span>' +
            (pick === undefined ? '<em class="muted">No pick</em>' : pick === ans ? '<em class="ok">You got it ✓</em>' : '<em class="err">You picked: ' + esc(t.options[pick]) + '</em>') + '</div>';
        }).join('') + '</section>';
    }

    function revealScreen() {
      const v = st.pub, p = st.priv, r = v.round;
      const mine = p.myEarnings;
      let hof = '';
      if (p.role === 'peddler' || p.role === 'prospect') {
        hof = '<section><h3>Hall of Fame</h3><p class="muted">Feature your ' + (p.role === 'peddler' ? 'invention and sketch' : 'character portrait') + ' in the Host’s Hall of Fame?</p><div class="btn-row">' +
          '<button class="btn ' + (p.hofChoice === true ? 'mint' : 'ghost') + '" data-act="hof" data-yes="1">Yes, feature it</button><button class="btn ' + (p.hofChoice === false ? 'red' : 'ghost') + '" data-act="hof" data-yes="0">No thanks</button></div></section>';
      }
      return '<section class="hello">' + (mine != null ? '<span class="eyebrow">You earned this round</span><div class="price-tag big-tag"><b>' + U.money2(mine) + '</b></div>' : '<h2>Money reveal</h2>') +
        '<p>Tonight so far: <b>' + U.money2(p.earned) + '</b></p></section>' + sleuthResults() + hof + shop() + wallet();
    }

    function awardsScreen() {
      const v = st.pub, p = st.priv, aw = v.awards;
      if (!aw) return '';
      const mine = p.votes || {};
      const img = (c) => (c.image && st.assets[c.image.id] ? '<img alt="" src="' + st.assets[c.image.id] + '">' : '');
      return '<section class="hello"><span class="eyebrow">End-of-night awards</span><h2>Cast your votes</h2><p class="muted">Tap one nominee in each category. You can change your mind until the winners are revealed.</p></section>' +
        aw.cats.map((c) => '<section class="vote-cat" data-key="vc-' + c.id + '"><h3>' + esc(c.title) + '</h3><div class="vote-list">' + c.candidates.map((x) => {
          const self = x.owner === p.pid;
          return '<button class="vote-opt' + (mine[c.id] === x.key ? ' on' : '') + '" data-act="vote" data-cat="' + c.id + '" data-key2="' + esc(x.key) + '"' + (self ? ' disabled' : '') + '>' + img(x) +
            '<span><b>' + esc(x.label) + '</b><em>' + (self ? 'That’s you' : esc(x.sub)) + '</em></span></button>';
        }).join('') + '</div></section>').join('');
    }
    function myTrophies() {
      const v = st.pub, p = st.priv;
      const res = v.awards && v.awards.results;
      if (!res) return '';
      const won = res.filter((r) => r.winners.some((w) => w.owner === p.pid));
      return won.length ? '<section class="trophy-mine"><span class="eyebrow">You won</span>' + won.map((r) => '<h3>' + esc(r.title) + '</h3>').join('') + '</section>' : '';
    }

    function finalScreen() {
      const v = st.pub, p = st.priv;
      const rank = v.standings.findIndex((x) => x.id === p.pid) + 1;
      const me = v.standings.find((x) => x.id === p.pid);
      return '<section class="hello"><span class="eyebrow">Final results</span><h2>' + (me && me.winner ? 'You’re the session champion!' : 'You finished #' + rank) + '</h2><div class="price-tag big-tag"><b>' + U.money2(p.earned) + '</b></div><p class="muted">Your cash and Power Cards are saved on this device for next time.</p></section>' + myTrophies() + shop() + wallet();
    }

    function body() {
      const v = st.pub, p = st.priv;
      if (!v || !p) return '<section class="hello"><h2>Connecting…</h2></section>';
      if (p.removed) return '<section class="hello"><h2>You’re not in this game</h2><p>' + esc(p.error || 'The Host removed you from the room.') + '</p><button class="btn gold" data-act="leave">Back</button></section>';
      const ph = v.phase, role = p.role;
      if (ph === 'lobby') return lobbyScreen();
      if (ph === 'roles') return rolesScreen();
      if (ph === 'reveal') return revealScreen();
      if (ph === 'final') return finalScreen();
      if (ph === 'awards') return awardsScreen();
      if (role === 'sitout' || !role) return '<section class="hello"><h2>Sitting out this round</h2><p>Enjoy the show. You’ll be in the next one.</p></section>';
      if (ph === 'brief') return briefScreen();
      if (ph === 'lab') return role === 'peddler' ? peddlerLab() : role === 'prospect' ? prospectLab() : philWait(esc((st.pub.players.find((x) => x.id === st.pub.round.peddler) || { name: 'The Peddler' }).name) + ' is inventing…');
      if (ph === 'fact') return role === 'peddler' ? peddlerFact() : role === 'prospect' ? prospectFact() : philWait('Fact-Finding');
      if (ph === 'pitch') return role === 'peddler' ? peddlerPitch() : role === 'prospect' ? prospectPitch() : philWait('PITCH!');
      if (ph === 'close') return role === 'peddler' ? '<section class="hello"><h2>Objections + Close</h2><p>Answer every objection directly, then clearly <b>ask for the sale</b>.</p></section>' + notes()
        : role === 'prospect' ? prospectClose() : philWait('Objections + Close');
      if (ph === 'scoring') return role === 'phil' ? scorecard(true) : role === 'prospect' ? '<section class="hello"><h2>The Philanthropists are scoring</h2></section>' + (p.verdict ? '' : verdictBlock())
        : '<section class="hello"><h2>The Philanthropists are deciding your fate</h2><p>Sit tight.</p></section>';
      return '';
    }

    /** SCREW! vote pop-up for Philanthropists and the other Prospects. Buttons open once the Peddler's response time ends. */
    function screwPop() {
      const v = st.pub, p = st.priv;
      if (!v || !p || !v.round || v.phase !== 'pitch') return '';
      const list = (p.screwVotes || []).filter((x) => !x.mine);
      if (!list.length) return '';
      const sv = list[0], live = v.round.activeScrew && v.round.activeScrew.by === sv.by;
      const ped = playerName(v.round.peddler);
      return '<div class="overlay screw-ov screw-pop-wrap" role="alertdialog" aria-label="SCREW! vote"><div class="screw-pop">' + U.screwIcon() +
        '<div class="screw-word">SCREW!</div><p class="by">' + esc(sv.name) + ' plays</p><h3>' + esc(sv.card.t) + '</h3><p>' + esc(sv.card.d) + '</p>' +
        (live ? '<p class="pop-q">Watch ' + esc(ped) + ' respond…</p>' + U.timerHTML(v.timer.screw, st.recvAt, 'screw-timer') : '<p class="pop-q">Did ' + esc(ped) + ' nail it?</p>') +
        '<div class="btn-row pop-btns"><button class="btn mint big" data-act="screwVote" data-by="' + esc(sv.by) + '" data-result="done"' + (live ? ' disabled' : '') + '>Nailed it</button>' +
        '<button class="btn ghost big" data-act="screwVote" data-by="' + esc(sv.by) + '" data-result="missed"' + (live ? ' disabled' : '') + '>Missed it</button></div></div></div>';
    }

    function render() {
      U.morph(root, '<div class="phone">' + header() + banners() + '<main class="ph-body" data-key="pb-' + (st.pub ? st.pub.phase + '-' + (st.priv && st.priv.role) : 'x') + '">' + body() + '</main>' + screwPop() + '</div>');
      mountPads();
    }

    // ---------- updates from the Host ----------
    function onPublic(v, at) {
      const prev = st.pub;
      st.pub = v; st.recvAt = at || Date.now();
      if (prev && prev.phase !== v.phase) {
        // leaving the lab: send any unsent drawing right away
        if (prev.phase === 'lab') Object.keys(st.pads).forEach(sendDrawing);
        st.confirm = null; st.chooser = null;
        if (st.priv && st.priv.role && v.phase !== 'scoring') U.vibrate(60);
      }
      const sc = v.round && v.round.activeScrew;
      if (sc && !(prev && prev.round && prev.round.activeScrew) && st.priv && st.priv.role === 'peddler') U.vibrate([80, 60, 80]);
      render();
    }
    function onPrivate(p) {
      const prev = st.priv;
      st.priv = p;
      const fresh = (p.screwVotes || []).some((x) => !(prev && prev.screwVotes || []).some((y) => y.by === x.by));
      if (fresh) U.vibrate([120, 60, 120]);
      if (p.lastError && p.lastError.at !== st.lastErr) {
        if (st.lastErr) U.toast(p.lastError.error, 'warn');
        st.lastErr = p.lastError.at;
      }
      if (opts.profile && p.wallet && !p.removed) {
        opts.profile.wallet = p.wallet; opts.profile.name = p.name;
        // save this round's invention to the player's own collection
        if (st.pub && st.pub.phase === 'reveal' && p.role === 'peddler' && st.pub.round && st.pub.round.invention && !st.sent['coll-' + st.pub.round.n]) {
          const inv = st.pub.round.invention, pd = st.pads['r' + st.pub.round.n + '-sketch'];
          st.sent['coll-' + st.pub.round.n] = true;
          opts.profile.inventions.unshift({ name: inv.name, slogan: inv.slogan, item: inv.item, func: inv.func, earned: p.myEarnings || 0, date: Date.now(), image: pd && !pd.isEmpty() ? pd.export() : null });
          opts.profile.inventions = opts.profile.inventions.slice(0, 30);
        }
        opts.onProfile && opts.onProfile(opts.profile);
      }
      if (prev && !prev.role && p.role) U.vibrate(80);
      render();
    }

    // ---------- events ----------
    let syncTimer = null;
    root.addEventListener('input', (e) => {
      const el = e.target;
      if (el.dataset.score) {
        const k = 'sc-r' + st.pub.round.n;
        const [grp, id] = el.dataset.score.split('.');
        st.drafts[k][grp][id] = Number(el.value);
        render();
        return;
      }
      if (el.dataset.draft) st.drafts[el.dataset.draft] = el.value;
      if (el.dataset.sync) {
        clearTimeout(syncTimer);
        syncTimer = setTimeout(() => {
          const k = 'r' + st.pub.round.n;
          send({ type: 'invention', name: draft(k + '-name', ''), slogan: draft(k + '-slogan', '') });
        }, 500);
      }
    });
    root.addEventListener('change', (e) => {
      const el = e.target;
      if (el.dataset.draft) st.drafts[el.dataset.draft] = el.value;
      if (el.dataset.act === 'pref') {
        const prefs = Object.assign({}, st.priv.prefs, { [el.dataset.role]: el.checked });
        if (opts.profile) { opts.profile.prefs = prefs; opts.onProfile && opts.onProfile(opts.profile); }
        send({ type: 'prefs', prefs });
      }
    });
    root.addEventListener('click', (e) => {
      const el = e.target.closest('[data-act]');
      if (!el || !root.contains(el) || el.tagName === 'INPUT') return;
      const d = el.dataset, a = d.act;
      const r = st.pub && st.pub.round;
      if (a === 'ask') st.confirm = d.ck;
      else if (a === 'cancel') st.confirm = null;
      else if (a === 'chooser') st.chooser = d.c || null;
      else if (a === 'pick') {
        const field = { item: 'item', func: 'func' }[d.deck];
        st.priv.invention[field] = Number(d.idx); // optimistic
        send({ type: 'invention', [field]: Number(d.idx) });
      } else if (a === 'labDone') {
        Object.keys(st.pads).forEach((k) => { if (st.pads[k].dirty) sendDrawing(k); });
        if (st.priv.role === 'peddler') {
          const k = 'r' + r.n;
          send({ type: 'invention', name: draft(k + '-name', st.priv.invention.name || ''), slogan: draft(k + '-slogan', st.priv.invention.slogan || '') });
        }
        send({ type: 'labDone' });
      } else if (a === 'unready') send({ type: 'labDone', done: false });
      else if (a === 'knowGo') { send({ type: 'nepo', card: 'knowPeople', target: draft('kp-out', r.prospects[0]), replacement: draft('kp-in', (root.querySelector('#kp-in') || {}).value) }); st.chooser = null; }
      else if (a === 'daddy') { send({ type: 'nepo', card: 'daddy', target: d.target }); st.chooser = null; }
      else if (a === 'notToday') send({ type: 'nepo', card: 'notToday' });
      else if (a === 'screwDone') send({ type: 'screwDone' });
      else if (a === 'screwVote') { (st.priv.screwVotes || []).forEach((x) => { if (x.by === d.by) x.mine = d.result; }); send({ type: 'screwVote', by: d.by, result: d.result }); U.toast('Vote in ✓'); }
      else if (a === 'answer') send({ type: 'secretAnswer', yes: d.yes === '1' });
      else if (a === 'selfReveal') { send({ type: 'secretAnswer', yes: true }); st.confirm = null; }
      else if (a === 'vote') { st.priv.votes = Object.assign({}, st.priv.votes, { [d.cat]: d.key2 }); send({ type: 'vote', cat: d.cat, key: d.key2 }); }
      else if (a === 'briefed') { if (st.pub.round) { st.pub.round.briefed = Object.assign({}, st.pub.round.briefed, { [st.priv.pid]: true }); } send({ type: 'briefed' }); }
      else if (a === 'screw') { send({ type: 'screw', idx: Number(d.idx) }); st.confirm = null; U.vibrate(100); }
      else if (a === 'pitchDone') { send({ type: 'pitchDone' }); st.confirm = null; }
      else if (a === 'objection') send({ type: 'objection' });
      else if (a === 'verdict') { st.priv.verdict = d.buy === '1' ? 'buy' : 'pass'; send({ type: 'verdict', buy: d.buy === '1' }); }
      else if (a === 'submitScore') { const k = 'sc-r' + r.n; send({ type: 'scorecard', cats: st.drafts[k].cats, prospects: st.drafts[k].prospects }); U.toast('Scorecard sent'); }
      else if (a === 'sleuthPick') { st.priv.sleuthPicks = Object.assign({}, st.priv.sleuthPicks, { [d.pid]: Number(d.idx) }); send({ type: 'sleuthPick', target: d.pid, idx: Number(d.idx) }); }
      else if (a === 'insiderGo') { send({ type: 'nepo', card: 'insider', phil: draft('it-phil', r.phils[0]), target: draft('it-target', r.prospects[0]) }); st.chooser = null; }
      else if (a === 'hof') send({ type: 'hof', yes: d.yes === '1' });
      else if (a === 'volunteer') send({ type: 'volunteer', role: d.role });
      else if (a === 'buy') { send({ type: 'buy', card: d.card }); st.confirm = null; }
      else if (a === 'leave') { opts.onLeave && opts.onLeave(); return; }
      render();
    });

    return {
      public: onPublic, private: onPrivate,
      asset: (id, data) => { st.assets[id] = data; },
      host: (on) => { st.host = on; render(); },
      connection: (c) => { st.conn = c; render(); },
      render,
      state: st
    };
  }

  P.phone = { create };
})(window.PITCH = window.PITCH || {});

  /** Simple practice bot: does something reasonable for its role in each phase. */
  function bot(seat) {
    const st = seat.phone.state, v = st.pub, p = st.priv, m = seat.memo;
    if (!v || !p || p.removed) return;
    const r = v.round, key = v.phase + (r ? r.n : '');
    const once = (k, fn) => { if (!m[key + k]) { m[key + k] = true; fn(); } };
    const send = (a) => seat.link.send(a);
    const rnd = (n) => Math.floor(Math.random() * n);
    const chance = (x) => Math.random() < x;
    if (v.phase === 'brief' && p.role && p.role !== 'sitout') {
      once('brief', () => setTimeout(() => send({ type: 'briefed' }), 800 + rnd(2500)));
    } else if (v.phase === 'lab' && p.role === 'peddler') {
      if (p.invention.item == null) {
        const it = rnd(3);
        send({ type: 'invention', item: it, func: rnd(3), name: 'The ' + p.hand.items[it] + ' ' + ['3000', 'Deluxe', 'Pro Max', '-inator', 'Supreme'][rnd(5)], slogan: ['You need this.', 'Why not?', 'Life, upgraded.', 'Patent pending.'][rnd(4)] });
      } else once('draw', () => { const pad = new U.DrawPad(); pad.scribble(); send({ type: 'drawing', data: pad.export() }); });
      if (p.invention.item != null && !p.labDone && chance(0.3)) send({ type: 'labDone' });
    } else if (v.phase === 'lab' && p.role === 'prospect') {
      once('draw', () => { const pad = new U.DrawPad(); pad.scribble(); send({ type: 'drawing', data: pad.export() }); });
      if (!p.labDone && chance(0.3)) send({ type: 'labDone' });
    } else if (v.phase === 'fact' && p.role === 'prospect') {
      if (p.secretStatus !== 'confirmed' && chance(0.004)) send({ type: 'secretAnswer', yes: true });
    } else if (v.phase === 'fact' && p.role === 'phil') {
      (p.sleuth || []).forEach((t) => { if (!t.locked && (p.sleuthPicks || {})[t.pid] === undefined) once('sleuth-' + t.pid, () => setTimeout(() => send({ type: 'sleuthPick', target: t.pid, idx: rnd(t.options.length) }), 1500 + rnd(6000))); });
    } else if (v.phase === 'pitch' && (p.screwVotes || []).some((x) => !x.mine && !(r.activeScrew && r.activeScrew.by === x.by))) {
      p.screwVotes.forEach((x) => { if (!x.mine && !(r.activeScrew && r.activeScrew.by === x.by)) once('vote-screw-' + x.by, () => setTimeout(() => send({ type: 'screwVote', by: x.by, result: chance(0.6) ? 'done' : 'missed' }), 800 + rnd(3000))); });
    } else if (v.phase === 'pitch' && p.role === 'prospect') {
      const t = v.timer.main;
      const left = t ? t.remaining - (t.running ? Date.now() - st.recvAt : 0) : 0;
      if (!p.screwPlayed && !r.activeScrew && !v.hostPaused && left > 25000 && chance(0.06)) send({ type: 'screw', idx: rnd(3) });
    } else if (v.phase === 'close' && p.role === 'prospect') {
      if (!r.objections[p.pid] && chance(0.2)) send({ type: 'objection' });
      if (!p.verdict && chance(0.15)) send({ type: 'verdict', buy: chance(0.5) });
    } else if (v.phase === 'scoring' && p.role === 'phil') {
      once('score', () => {
        const cats = {}; C.categories.forEach((c) => { cats[c.id] = 15 + rnd(8) * 5; });
        const pros = {}; r.prospects.forEach((id) => { pros[id] = rnd(6) * 5; });
        setTimeout(() => send({ type: 'scorecard', cats, prospects: pros }), 1000 + rnd(3000));
      });
    } else if (v.phase === 'scoring' && p.role === 'prospect') {
      if (!p.verdict) send({ type: 'verdict', buy: chance(0.5) });
    } else if (v.phase === 'awards' && v.awards) {
      v.awards.cats.forEach((c) => {
        const opts = c.candidates.filter((x) => x.owner !== p.pid);
        if (opts.length && !(p.votes || {})[c.id]) once('vote-' + c.id, () => setTimeout(() => send({ type: 'vote', cat: c.id, key: opts[rnd(opts.length)].key }), 600 + rnd(3000)));
      });
    } else if (v.phase === 'reveal' && (p.role === 'peddler' || p.role === 'prospect')) {
      once('hof', () => send({ type: 'hof', yes: chance(0.5) }));
    }
  }

  // ---------------------------------------------------------------- boot
  app_boot();
  function app_boot() {
    U.startTimerLoop({ beep: true });
    const q = new URLSearchParams(location.search);
    const room = (q.get('room') || '').toUpperCase().replace(/[^A-Z]/g, '').slice(0, 4);
    if (room && onlineAllowed()) joinScreen(room);
    else if (q.get('practice') != null) startPractice(Number(q.get('practice')) || 5);
    else home();
  }
  P.app = { home, startPractice };
})(window.PITCH = window.PITCH || {});

/* artifact build */
</script>
